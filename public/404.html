<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Sector Not Found | BATTLE TANK</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B1120" />
    <link rel="icon" type="image/svg+xml" href="/images/icon.svg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#0B1120] text-slate-100 min-h-screen flex items-center justify-center p-6">
    <main class="max-w-lg w-full bg-[#0F172A] border border-slate-700/70 rounded-2xl p-8 text-center shadow-2xl">
      <p class="text-xs font-mono uppercase tracking-[0.25em] text-amber-400 mb-3">Error 404</p>
      <h1 class="text-3xl font-bold tracking-tight text-white mb-3">Sector Not Found</h1>
      <p class="text-slate-400 text-sm leading-relaxed mb-6">
        The requested tactical coordinates do not exist on this battlefield. Return to Command HQ to deploy.
      </p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a
          href="/"
          class="px-5 py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-sm transition-colors"
        >
          Return to HQ
        </a>
        <a
          href="/campaign"
          class="px-5 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium text-sm transition-colors"
        >
          Campaign
        </a>
      </div>
    </main>
  </body>
</html>
