<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #0B1120; }
    .turret { fill: #FBBF24; }
    .hull { fill: #F59E0B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #162033; }
      .turret { fill: #FCD34D; }
      .hull { fill: #FBBF24; }
    }
  </style>

  <!-- Armor plate background -->
  <rect class="bg" width="64" height="64" rx="14" />

  <!-- Turret & cannon barrel -->
  <path class="turret" d="M35 23h21v4.5H35z" />
  <rect x="52" y="21.5" width="5" height="7.5" rx="1" fill="#FDE68A" />
  <rect x="38" y="22.2" width="5" height="6" rx="0.8" fill="#B45309" />
  <path class="turret" d="M18 19.5h15.5l4.5 5v5.5H15l3-10.5z" />
  <rect x="21" y="16.5" width="7" height="3" rx="1" fill="#FDE68A" />
  <rect x="31" y="22.5" width="3.5" height="2" rx="0.5" fill="#38BDF8" />

  <!-- Sloped tank hull -->
  <path class="hull" d="M10 34.5l4.5-4.5h29l6 4.5v4.5H10v-4.5z" />
  <path d="M10 34.5h39.5v2H10z" fill="#B45309" fill-opacity="0.45" />

  <!-- Armored tracks & roadwheels -->
  <rect x="8.5" y="38.5" width="43" height="11.5" rx="5.75" fill="#1E293B" stroke="#F59E0B" stroke-width="2.2" />
  <circle cx="15.5" cy="44.25" r="3" fill="#0B1120" stroke="#FBBF24" stroke-width="1.4" />
  <circle cx="25" cy="44.25" r="3" fill="#0B1120" stroke="#FBBF24" stroke-width="1.4" />
  <circle cx="34.5" cy="44.25" r="3" fill="#0B1120" stroke="#FBBF24" stroke-width="1.4" />
  <circle cx="44" cy="44.25" r="3" fill="#0B1120" stroke="#FBBF24" stroke-width="1.4" />
</svg>
