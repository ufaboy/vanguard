<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Transparent background, full-width bold tank silhouette -->
  <!-- Cannon barrel & muzzle brake -->
  <rect x="40" y="18" width="19" height="6.5" fill="#F59E0B" stroke="#78350F" stroke-width="1.2" />
  <rect x="55" y="16" width="7" height="10.5" rx="1.5" fill="#FBBF24" stroke="#78350F" stroke-width="1.2" />

  <!-- Turret & cupola -->
  <rect x="20" y="10" width="11" height="4.5" rx="1.2" fill="#FDE68A" stroke="#78350F" stroke-width="1.2" />
  <path d="M15 14.5h22l5.5 6v8.5H12l3-14.5z" fill="#FCD34D" stroke="#78350F" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Sloped hull -->
  <path d="M4 36l6-7h38l8 7v4.5H4z" fill="#F59E0B" stroke="#78350F" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Chunky tracks & 3 bold roadwheels -->
  <rect x="3" y="40" width="53" height="14" rx="7" fill="#1E293B" stroke="#D97706" stroke-width="3.5" />
  <circle cx="13" cy="47" r="3.6" fill="#FBBF24" />
  <circle cx="29.5" cy="47" r="3.6" fill="#FBBF24" />
  <circle cx="46" cy="47" r="3.6" fill="#FBBF24" />
</svg>
