<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battlefield — BATTLE TANK</title>
    <meta name="description" content="Deploy into 3D tactical tank combat in BATTLE TANK." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="google-adsense-account" content="ca-pub-3217305527287787" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3217305527287787" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TB78X2F4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/index.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-page="battlefield" class="bg-[#0B1120] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 overflow-hidden">
    <div id="root"><!-- prerender:start -->
<div id="game-shell" class="relative w-screen h-screen overflow-hidden bg-[#0B0F17] text-[#F8FAFC] select-none font-sans">
      <!-- 100% Full-bleed 3D WebGL Canvas Mount -->
      <div id="canvas-mount" class="fixed inset-0 w-full h-full cursor-crosshair"></div>

      <!-- Top-Left Compact Telemetry Bar -->
      <!-- Top-Left Hull HP, Turret & Sector Telemetry -->
      <header id="top-telemetry" class="hidden fixed top-3 left-4 z-20 flex flex-col gap-1.5 pointer-events-none"></header>

      <!-- Top-Center Live Azimuth Compass -->
      <div id="top-compass" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-20 pointer-events-none"></div>

      <!-- Top-Right APS Status & Utility Controls -->
      <div id="top-controls" class="hidden fixed top-3 right-4 z-20 flex flex-col items-end gap-1.5"></div>

      <!-- Bottom-Right Circular Tactical Radar -->
      <div id="sensor-minimap" class="hidden fixed bottom-3 right-4 z-20 pointer-events-none"></div>

      <!-- Contract Cargo & Gate Warning HUD -->
      <div id="contract-hud" class="hidden fixed top-40 left-4 z-20 flex flex-col gap-2 max-w-[min(560px,92vw)]"></div>

      <!-- Contextual Contract Interaction / Extraction Control Bar -->
      <div id="contract-action-bar" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-20 flex items-center justify-center"></div>

      <!-- Boss Condition Banner -->
      <div id="boss-banner" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-20 w-[min(560px,90vw)] bg-[#0B0F17]/95 border border-red-500/70 px-5 py-3 rounded shadow-2xl"></div>

      <!-- Observed Target Condition Badge -->
      <div id="target-badge" class="hidden fixed top-36 left-1/2 -translate-x-1/2 z-20 pointer-events-none bg-[#0B0F17]/95 border border-teal-500/70 px-4 py-1.5 rounded text-xs font-mono uppercase tracking-wider shadow-lg"></div>

      <!-- Tactical Status Toast -->
      <div id="status-toast" class="hidden fixed top-48 left-1/2 -translate-x-1/2 z-20 pointer-events-none bg-[#0B0F17]/95 border border-amber-500/70 px-5 py-2 rounded text-xs font-mono uppercase tracking-[0.12em] text-amber-300 shadow-lg"></div>

      <!-- Active Combat Modifiers Strip -->
      <div id="modifiers-strip" class="hidden fixed top-24 right-4 z-20 flex flex-col gap-1.5 items-end pointer-events-none"></div>

      <!-- Modular Tank Garage, Workshop & 5x5 Engineering Drawer [U] -->
      <div id="upgrade-drawer" class="hidden hangar-shell" role="dialog" aria-modal="true" aria-label="Vehicle maintenance garage"></div>

      <!-- Bottom Docked Tactical HUD (Speed/Gear + Weapons/Reload/Modules) -->
      <footer id="bottom-hud" class="hidden fixed bottom-3 left-4 right-48 z-20 flex items-end justify-between gap-3 pointer-events-none"></footer>

      <!-- Modal Overlays: Menu, Pause, Victory, Game Over -->
      <div id="status-modal" class="fixed inset-0 z-30 flex items-center justify-center bg-black/75 p-4" data-page="battlefield">
        <div class="battlefield-loader" role="status" aria-live="polite">
          <span class="btn-rivet top-left" aria-hidden="true"></span>
          <span class="btn-rivet top-right" aria-hidden="true"></span>
          <span class="btn-rivet bottom-left" aria-hidden="true"></span>
          <span class="btn-rivet bottom-right" aria-hidden="true"></span>
          <div class="battlefield-loader-radar" aria-hidden="true">
            <div class="battlefield-loader-sweep"></div>
            <svg class="battlefield-loader-tank" viewBox="0 0 48 22" fill="currentColor">
              <path d="M18 4h11l2 4h14v2.5H31l1.5 3.5H13l3-6h2V4zm-8 10h28l4 4H6l4-4zm2 4.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
            </svg>
          </div>
          <div class="battlefield-loader-kicker">BATTLEFIELD DEPLOYMENT</div>
          <h1 class="battlefield-loader-title">DEPLOYING UNIT</h1>
          <p class="battlefield-loader-sub">Initializing 3D tactical arena…</p>
          <div class="battlefield-loader-track" aria-hidden="true">
            <div class="battlefield-loader-bar"></div>
          </div>
          <div class="battlefield-loader-steps" aria-hidden="true">
            <span>TEXTURES</span>
            <span>TERRAIN</span>
            <span>SYSTEMS</span>
          </div>
        </div>
      </div>
    </div>
    </div>
    <noscript>
      <main style="max-width:720px;margin:48px auto;padding:24px;font-family:system-ui,sans-serif;color:#f8fafc;">
        <h1>Battlefield — BATTLE TANK</h1>
        <p>JavaScript and WebGL are required to launch 3D tactical tank combat.</p>
      </main>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
